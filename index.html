<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="医学期刊的封面、图文摘要和正文组图。查看原图、作图思路及出处。">
<title>医学期刊图集</title>
<style>
  :root {color-scheme:light; --paper:#f6f7f2; --ink:#171f1b; --muted:#56625a; --edge:#d7ddd5; --accent:#1b563f; --panel:#fff}
  * {box-sizing:border-box}
  body {margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap {width:min(100% - 44px,1180px); margin-inline:auto}
  header {padding:42px 0 22px; border-bottom:1px solid var(--edge)}
  h1 {margin:0; font-size:clamp(33px,5vw,53px); line-height:1.14; letter-spacing:-.045em}
  header p {margin:9px 0 0; color:var(--muted)}
  main {padding:18px 0 64px}
  button,input,select {font:inherit}
  button {cursor:pointer}
  a {color:var(--accent); text-underline-offset:3px}
  :focus-visible {outline:2px solid #226747; outline-offset:3px}
  .controls,.filters,.nav,.view-options {display:flex; flex-wrap:wrap; gap:9px 12px; align-items:center}
  .controls {justify-content:space-between; gap:12px; margin-bottom:12px}
  .tab,.plain,select,input[type=search] {min-height:40px; border:1px solid var(--edge); border-radius:8px; background:white; color:var(--ink); padding:5px 11px}
  .tab[aria-pressed=true] {background:var(--accent); border-color:var(--accent); color:#fff}
  input[type=search] {width:min(29ch,100%)}
  select {max-width:min(38ch,100%)}
  input[type=checkbox] {accent-color:var(--accent); width:16px; height:16px; vertical-align:-3px}
  .view-options {color:var(--muted); font-size:14px}
  #status {margin:13px 0 8px; font-size:14px; color:var(--muted)}
  #gallery {display:grid; grid-template-columns:minmax(0,1fr); gap:20px}
  #gallery.compact {grid-template-columns:repeat(2,minmax(0,1fr))}
  .card {min-width:0; overflow:hidden; background:white; border:1px solid var(--edge); border-radius:12px}
  .preview {position:relative; display:block; width:100%; height:clamp(330px,59vh,640px); padding:12px; border:0; border-bottom:1px solid var(--edge); background:white; cursor:zoom-in}
  .compact .preview {height:clamp(250px,38vw,450px)}
  .preview:focus-visible {outline-offset:-4px}
  .preview img {display:block; width:100%; height:100%; object-fit:contain}
  .zoom {position:absolute; right:13px; bottom:13px; padding:4px 9px; border:1px solid var(--edge); border-radius:6px; background:#fff; color:var(--accent); font-size:13px; font-weight:650}
  .preview:hover .zoom {border-color:var(--accent)}
  .card-content {padding:14px 18px 16px}
  .meta,.credit {font-size:13px; color:var(--muted)}
  .meta {margin:0 0 4px}
  h2 {font-size:20px; line-height:1.35; margin:0}
  .note {margin:5px 0 9px; color:var(--muted)}
  .tags {list-style:none; display:flex; flex-wrap:wrap; gap:5px 8px; padding:0; margin:0 0 9px}
  .tags li {background:#edf1eb; border-radius:5px; padding:2px 7px; font-size:13px}
  .source {display:flex; flex-wrap:wrap; gap:5px 12px; align-items:baseline; font-size:14px}
  .empty,.image-error {padding:12px 16px; margin:0; color:var(--muted)}
  dialog {width:min(1400px,calc(100% - 22px)); max-height:calc(100dvh - 18px); padding:0; border:1px solid var(--edge); border-radius:12px; color:var(--ink); background:white}
  dialog::backdrop {background:rgba(15,25,20,.78)}
  .viewer-bar {display:flex; justify-content:space-between; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--edge)}
  .viewer-bar h2 {font-size:18px}
  .viewer-bar form {margin:0; flex:none}
  #viewer img {display:block; width:100%; height:min(82dvh,1050px); object-fit:contain; padding:6px}
  #viewer img[hidden] {display:none}
  #viewer-source {padding:8px 14px 11px; border-top:1px solid var(--edge)}
  @media (max-width:700px) {
    .wrap {width:calc(100% - 24px)}
    header {padding-top:25px}
    #gallery.compact {grid-template-columns:minmax(0,1fr)}
    .view-options label:has(#compact) {display:none}
    .preview,.compact .preview {height:clamp(240px,90vw,490px); padding:6px}
    .tab {padding:5px 8px; font-size:14px}
    .card-content {padding:12px}
    #viewer img {height:min(72dvh,680px)}
  }
</style>
</head>
<body>
<header><div class="wrap"><h1>医学期刊图集</h1><p>浏览封面、图文摘要和正文组图。点图可在本页放大。</p></div></header>
<main class="wrap">
  <div class="controls">
    <nav id="categories" class="nav" aria-label="图片类别"></nav>
    <div class="filters">
      <input id="search" type="search" aria-label="搜索图集" placeholder="搜索研究主题、期刊或作图方式">
      <select id="journal" aria-label="筛选期刊"><option value="">全部期刊</option></select>
      <button class="plain" id="reset" type="button">清除筛选</button>
    </div>
  </div>
  <div class="view-options">
    <label><input id="all-sources" type="checkbox">包含仅有出处的条目</label>
    <label><input id="compact" type="checkbox">并排浏览</label>
  </div>
  <p id="status" role="status"></p>
  <section id="gallery" aria-label="医学期刊图片"></section>
</main>
<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-bar"><h2 id="viewer-title"></h2><form method="dialog"><button class="plain" autofocus>关闭</button></form></div>
  <img alt="" referrerpolicy="no-referrer">
  <p class="image-error" hidden>图片暂时无法加载，可打开原始出处。</p>
  <div id="viewer-source" class="source"></div>
</dialog>
<script id="catalog" type="application/json">

<script>(function gallery() {
  const types = {all:'全部', cover:'期刊封面', abstract:'图文摘要', figures:'正文组图'};
  const licenses = {by:'CC BY 4.0', 'by-nc':'CC BY-NC 4.0', 'by-nc-nd':'CC BY-NC-ND 4.0'};
  const items = JSON.parse(document.querySelector('#catalog').textContent);
  const search = document.querySelector('#search');
  const journal = document.querySelector('#journal');
  const allSources = document.querySelector('#all-sources');
  const compact = document.querySelector('#compact');
  const grid = document.querySelector('#gallery');
  const status = document.querySelector('#status');
  const viewer = document.querySelector('#viewer');
  const viewerImage = viewer.querySelector('img');
  const viewerError = viewer.querySelector('.image-error');
  const tabs = new Map();
  let category = 'all';

  function el(tag, name, text) {
    const element = document.createElement(tag);
    if (name) element.className = name;
    if (text) element.textContent = text;
    return element;
  }
  function link(text, url) {
    const element = el('a', '', text);
    element.href = url;
    element.target = '_blank';
    element.rel = 'noopener noreferrer';
    return element;
  }
  function creditLine(credit, license) {
    const line = el('span','credit');
    line.append(credit + ' · ', link(licenses[license], 'https://creativecommons.org/licenses/' + license + '/4.0/'), ' · 图像未修改');
    return line;
  }
  function openImage(item) {
    const [kind, journalName, year, title, , , url, image, credit, license] = item;
    viewer.querySelector('#viewer-title').textContent = title;
    viewer.querySelector('#viewer-source').replaceChildren(link('原始出处 ↗', url), creditLine(credit, license));
    viewerImage.alt = title + ' · ' + [types[kind], journalName, year].filter(Boolean).join(' · ');
    viewerError.hidden = true;
    viewerImage.hidden = false;
    viewerImage.src = image;
    viewer.showModal();
  }
  function card(item) {
    const [kind, name, year, title, keywords, note, url, image, credit, license] = item;
    const box = el('article','card');
    if (image) {
      const preview = el('button','preview');
      preview.type = 'button';
      preview.setAttribute('aria-label','放大查看：' + title);
      const img = el('img');
      img.alt = title;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => {
        preview.remove();
        box.prepend(el('p','image-error','图片暂时无法加载，可打开原始出处。'));
      }, {once:true});
      preview.append(img,el('span','zoom','放大查看'));
      img.src = image;
      preview.addEventListener('click', () => openImage(item));
      box.append(preview);
    }
    const content = el('div','card-content');
    content.append(el('p','meta',[types[kind],name,year].filter(Boolean).join(' · ')), el('h2','',title), el('p','note',note));
    const tags = el('ul','tags');
    for (const keyword of keywords.split('|')) tags.append(el('li','',keyword));
    content.append(tags);
    const source = el('div','source');
    source.append(link('原始出处 ↗',url));
    if (image) source.append(creditLine(credit,license));
    else source.append(el('span','credit','仅收录出处'));
    content.append(source);
    box.append(content);
    return box;
  }
  function scope() {
    return allSources.checked ? items : items.filter(item => item[7]);
  }
  function updateJournals() {
    const previous = journal.value;
    const names = [...new Set(scope().map(item => item[1]))].sort((a,b) => a.localeCompare(b,'en'));
    journal.replaceChildren(new Option('全部期刊',''), ...names.map(name => new Option(name,name)));
    journal.value = names.includes(previous) ? previous : '';
  }
  function normalized(text) {
    return text.normalize('NFKC').toLocaleLowerCase();
  }
  function render() {
    const available = scope();
    const words = normalized(search.value).trim().split(/\s+/).filter(Boolean);
    const results = available.filter(item => {
      const [kind, name, year, title, keywords, note] = item;
      const matches = normalized([types[kind], name, year, title, keywords, note].join(' '));
      return (category === 'all' || kind === category) && (!journal.value || journal.value === name) && words.every(word => matches.includes(word));
    });
    for (const [type, tab] of tabs) {
      const count = type === 'all' ? available.length : available.filter(item => item[0] === type).length;
      tab.textContent = types[type] + ' ' + count;
      tab.setAttribute('aria-pressed',String(type === category));
    }
    status.textContent = '显示 ' + results.length + ' / ' + available.length + (allSources.checked ? ' 条记录' : ' 张图片');
    grid.replaceChildren(...results.map(card));
    if (!results.length) grid.append(el('p','empty','没找到匹配的样例。可以换个关键词或清除筛选。'));
  }
  for (const type of Object.keys(types)) {
    const tab = el('button','tab');
    tab.type = 'button';
    tab.addEventListener('click', () => {category = type; render();});
    tabs.set(type,tab);
    document.querySelector('#categories').append(tab);
  }
  search.addEventListener('input',render);
  journal.addEventListener('change',render);
  allSources.addEventListener('change', () => {updateJournals(); render();});
  compact.addEventListener('change', () => grid.classList.toggle('compact',compact.checked));
  document.querySelector('#reset').addEventListener('click', () => {
    category = 'all';
    search.value = '';
    journal.value = '';
    render();
    search.focus();
  });
  viewer.addEventListener('click', event => {if (event.target === viewer) viewer.close();});
  viewerImage.addEventListener('error', () => {viewerImage.hidden = true; viewerError.hidden = false;});
  updateJournals();
  render();
})();</script>
</body>
</html>
