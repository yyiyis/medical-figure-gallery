<body>
<header><div class="wrap hero"><h1>医学期刊图集</h1><p>从期刊封面、图文摘要和正文组图里，找适合手头研究的配图参考。</p></div></header>
<main class="wrap">
  <div class="controls">
    <nav id="categories" class="tabs" aria-label="图片类别"></nav>
    <div class="filters" role="group" aria-label="筛选样例">
      <label class="field"><span>搜索</span><input id="search" type="search" placeholder="例如：研究设计、时间轴、衰老"></label>
      <label class="field"><span>期刊</span><select id="journal"><option value="">全部期刊</option></select></label>
      <label class="check"><input id="previews" type="checkbox">只看有预览</label>
      <button id="reset" type="button">清除筛选</button>
    </div>
  </div>
  <p id="status" class="count" role="status"></p>
  <div id="gallery" class="gallery" aria-label="期刊配图样例"></div>
  <noscript><p>请启用 JavaScript 以浏览和筛选图集。</p></noscript>
</main>
<footer><div class="wrap"><p>用于非商业科研绘图参考。图像许可和署名见对应条目，所有条目均附原始出处。</p></div></footer>

<script>(function () {
  const categories = { all: '全部', cover: '期刊封面', abstract: '图文摘要', figures: '正文组图' };
  const licenses = { by: 'CC BY 4.0', 'by-nc-nd': 'CC BY-NC-ND 4.0' };
  const items = JSON.parse(document.querySelector('#catalog').textContent);
  const grid = document.querySelector('#gallery');
  const search = document.querySelector('#search');
  const journal = document.querySelector('#journal');
  const previews = document.querySelector('#previews');
  const status = document.querySelector('#status');
  const tabs = [];
  let active = 'all';

  function el(tag, classname, text) {
    const node = document.createElement(tag);
    if (classname) node.className = classname;
    if (text) node.textContent = text;
    return node;
  }
  function external(label, url, classname) {
    const a = el('a', classname, label);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    return a;
  }
  function card(item) {
    const [kind, name, year, title, keywords, note, url, image, credit, license] = item;
    const box = el('article', 'card ' + kind);
    const link = external(image ? '' : '去期刊查看', url, 'media' + (image ? ' pictured' : ''));
    link.setAttribute('aria-label', '查看原始出处：' + title);
    if (image) {
      const img = el('img');
      img.alt = title + ' · ' + categories[kind];
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => {
        link.classList.remove('pictured');
        link.textContent = '去期刊查看';
      }, { once: true });
      img.src = image;
      link.append(img);
    }
    const content = el('div', 'card-content');
    content.append(el('p','meta',[categories[kind],name,year].filter(Boolean).join(' · ')), el('h2','',title), el('p','note',note));
    const tags = el('ul', 'tags');
    for (const keyword of keywords.split('|')) tags.append(el('li','',keyword));
    content.append(tags);
    const source = el('div','source');
    source.append(external('原始出处', url));
    if (image && license) {
      const line = el('div','credit');
      line.append(document.createTextNode(credit + ' · '), external(licenses[license], 'https://creativecommons.org/licenses/' + license + '/4.0/'), document.createTextNode(' · 图像未修改'));
      source.append(line);
    }
    content.append(source);
    box.append(link, content);
    return box;
  }
  function normalized(value) { return value.normalize('NFKC').toLocaleLowerCase(); }
  function update() {
    const words = normalized(search.value).trim().split(/\s+/).filter(Boolean);
    const results = items.filter(item => {
      const [kind, name, year, title, keywords, note, , image] = item;
      const haystack = normalized([categories[kind], name, year, title, keywords, note].join(' '));
      return (active === 'all' || kind === active) && (!journal.value || journal.value === name) && (!previews.checked || Boolean(image)) && words.every(word => haystack.includes(word));
    });
    for (const [kind, button] of tabs) button.setAttribute('aria-pressed', String(kind === active));
    status.textContent = '显示 ' + results.length + ' / ' + items.length + ' 个样例';
    grid.replaceChildren(...results.map(card));
    if (!results.length) grid.append(el('p','empty','没找到匹配的样例。可以换个关键词或清除筛选。'));
  }
  for (const [kind, label] of Object.entries(categories)) {
    const count = kind === 'all' ? items.length : items.filter(item => item[0] === kind).length;
    const button = el('button','tab',label + ' ' + count);
    button.type = 'button';
    button.addEventListener('click', () => { active = kind; update(); });
    tabs.push([kind, button]);
    document.querySelector('#categories').append(button);
  }
  for (const name of [...new Set(items.map(item => item[1]))].sort((a,b) => a.localeCompare(b,'en'))) {
    journal.add(new Option(name,name));
  }
  search.addEventListener('input',update);
  journal.addEventListener('change',update);
  previews.addEventListener('change',update);
  document.querySelector('#reset').addEventListener('click',() => {
    active = 'all';
    search.value = '';
    journal.value = '';
    previews.checked = false;
    update();
    search.focus();
  });
  update();
})();</script>
