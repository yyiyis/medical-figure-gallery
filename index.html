<script>(function gallery() {
  const types = {all:'全部', cover:'期刊封面', abstract:'图文摘要', figures:'正文组图'};
  const licenses = {by:'CC BY 4.0', 'by-nc':'CC BY-NC 4.0', 'by-nc-nd':'CC BY-NC-ND 4.0'};
  const items = JSON.parse(document.querySelector('#catalog').textContent);
  const search = document.querySelector('#search');
  const journal = document.querySelector('#journal');
  const allSources = document.querySelector('#all-sources');
  const singleColumn = document.querySelector('#single-column');
  const grid = document.querySelector('#gallery');
  const status = document.querySelector('#status');
  const viewer = document.querySelector('#viewer');
  const viewerImage = viewer.querySelector('img');
  const viewerError = viewer.querySelector('.image-error');
  const viewerViewport = document.querySelector('#viewer-viewport');
  const actualSize = document.querySelector('#actual-size');
  const tabs = new Map();
  let category = 'all';

  function el(tag, name, text) {
    const element = document.createElement(tag);
    if (name) element.className = name;
    if (text) element.textContent = text;
    return element;
  }
  function link(text, url) {
    const element = el('a', '', text);
    element.href = url;
    element.target = '_blank';
    element.rel = 'noopener noreferrer';
    return element;
  }
  function creditLine(credit, license) {
    const line = el('span','credit');
    line.append(credit + ' · ');
    if (license !== 'pd') line.append(link(licenses[license], 'https://creativecommons.org/licenses/' + license + '/4.0/'), ' · ');
    line.append('图像未修改');
    return line;
  }
  function loadImage(img, image, quality, onFailure) {
    img.onerror = () => {
      if (quality.url && img.getAttribute('src') === quality.url) {
        img.src = image;
        return;
      }
      onFailure();
    };
    img.src = quality.url || image;
  }
  function setActualSize(active) {
    viewer.classList.toggle('actual-size', active);
    actualSize.setAttribute('aria-pressed', String(active));
    actualSize.textContent = active ? '适应窗口' : '原始尺寸';
    viewerViewport.scrollTo(0, 0);
  }
  function openImage(item) {
    const [kind, journalName, year, title, , , url, image, credit, license, quality] = item;
    viewer.querySelector('#viewer-title').textContent = title;
    viewer.querySelector('#viewer-source').replaceChildren(link('原始出处 ↗', url), creditLine(credit, license));
    viewerImage.alt = title + ' · ' + [types[kind], journalName, year].filter(Boolean).join(' · ');
    viewerError.hidden = true;
    viewerImage.hidden = false;
    viewer.style.setProperty('--figure-aspect',quality.width / quality.height);
    actualSize.disabled = false;
    loadImage(viewerImage,image,quality,() => {
      viewerImage.hidden = true;
      viewerError.hidden = false;
      actualSize.disabled = true;
    });
    viewer.showModal();
    setActualSize(false);
  }
  function card(item) {
    const [kind, name, year, title, keywords, note, url, image, credit, license, quality] = item;
    const box = el('article','card');
    if (image) {
      const preview = el('button','preview');
      preview.type = 'button';
      preview.setAttribute('aria-label','放大查看：' + title);
      const img = el('img');
      img.alt = title;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.width = quality.width;
      img.height = quality.height;
      loadImage(img,image,quality,() => {
        preview.remove();
        box.prepend(el('p','image-error','图片暂时无法加载，可打开原始出处。'));
      });
      preview.append(img);
      preview.addEventListener('click', () => openImage(item));
      box.append(preview);
    }
    const content = el('div','card-content');
    content.append(el('p','meta',[types[kind],name,year].filter(Boolean).join(' · ')), el('h2','',title), el('p','note',note));
    const tags = el('ul','tags');
    for (const keyword of keywords.split('|')) tags.append(el('li','',keyword));
    content.append(tags);
    const source = el('div','source');
    source.append(link('原始出处 ↗',url));
    if (image) source.append(creditLine(credit,license));
    else source.append(el('span','credit','仅收录出处'));
    content.append(source);
    box.append(content);
    return box;
  }
  function renderJournalScope() {
    const registry = JSON.parse(document.querySelector('#journal-registry').textContent);
    const imagesPerJournal = new Map();
    for (const [,name,,,,,,image] of items) {
      if (image) imagesPerJournal.set(name,(imagesPerJournal.get(name) || 0) + 1);
    }
    const count = registry.groups.reduce((total,group) => total + group.journals.length,0);
    document.querySelector('#scope-summary').textContent = count + ' 刊拟盘点 · ' + imagesPerJournal.size + ' 刊可预览';
    const groups = registry.groups.map(group => {
      const section = el('section');
      const list = el('ul');
      section.append(el('h2','',group.title),list);
      for (const journal of group.journals) {
        const entry = el('li','',journal.name);
        const previewCount = imagesPerJournal.get(journal.name);
        if (previewCount) entry.append(el('span','scope-badge',previewCount + ' 张图'));
        if (journal.archive && !journal.track) {
          const archive = link('2026 原刊归档',journal.archive);
          archive.className = 'scope-badge';
          entry.append(archive);
        }
        list.append(entry);
      }
      return section;
    });
    document.querySelector('#scope-groups').replaceChildren(...groups);
  }
  renderJournalScope();
  function scope() {
    return allSources.checked ? items : items.filter(item => item[7]);
  }
  function updateJournals() {
    const previous = journal.value;
    const names = [...new Set(scope().map(item => item[1]))].sort((a,b) => a.localeCompare(b,'en'));
    journal.replaceChildren(new Option('全部期刊',''), ...names.map(name => new Option(name,name)));
    journal.value = names.includes(previous) ? previous : '';
  }
  function normalized(text) {
    return text.normalize('NFKC').toLocaleLowerCase();
  }
  function render() {
    const available = scope();
    if (category !== 'all' && !available.some(item => item[0] === category)) category = 'all';
    const words = normalized(search.value).trim().split(/\s+/).filter(Boolean);
    const results = available.filter(item => {
      const [kind, name, year, title, keywords, note] = item;
      const matches = normalized([types[kind], name, year, title, keywords, note].join(' '));
      return (category === 'all' || kind === category) && (!journal.value || journal.value === name) && words.every(word => matches.includes(word));
    });
    for (const [type, tab] of tabs) {
      const count = type === 'all' ? available.length : available.filter(item => item[0] === type).length;
      tab.hidden = count === 0;
      tab.textContent = types[type] + ' ' + count;
      tab.setAttribute('aria-pressed',String(type === category));
    }
    status.textContent = '显示 ' + results.length + ' / ' + available.length + (allSources.checked ? ' 条记录' : ' 张图片');
    grid.replaceChildren(...results.map(card));
    if (!results.length) grid.append(el('p','empty','没找到匹配的样例。可以换个关键词或清除筛选。'));
  }
  for (const type of Object.keys(types)) {
    const tab = el('button','tab');
    tab.type = 'button';
    tab.addEventListener('click', () => {category = type; render();});
    tabs.set(type,tab);
    document.querySelector('#categories').append(tab);
  }
  search.addEventListener('input',render);
  journal.addEventListener('change',render);
  allSources.addEventListener('change', () => {updateJournals(); render();});
  singleColumn.addEventListener('change', () => grid.classList.toggle('single-column',singleColumn.checked));
  document.querySelector('#reset').addEventListener('click', () => {
    category = 'all';
    search.value = '';
    journal.value = '';
    render();
    search.focus();
  });
  viewer.addEventListener('click', event => {if (event.target === viewer) viewer.close();});
  actualSize.addEventListener('click', () => setActualSize(!viewer.classList.contains('actual-size')));
  updateJournals();
  render();
})();</script>
</body>
</html>
