name: Medical figure gallery
on:
  schedule:
    - cron: "20 1 * * 1"
  push:
    branches: [main]
    paths: [index.html, .github/workflows/figure-gallery.yml, assets/gallery-search.js, assets/gallery-style.css, tools/update_site.py, tools/promote_history.py, tools/update_weekly.py]
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [pilot, backfill, weekly, history, deploy]
        default: pilot
      start:
        description: First online date, start (YYYY-MM-DD, optional)
      end:
        description: First online date, end (YYYY-MM-DD, optional)
      journals:
        description: Comma-separated journal names (optional)
      report_run:
        description: Historical scan run ID (optional, uses the saved cloud report when blank)
      review_dois:
        description: Comma-separated reviewed DOIs to publish (history or weekly mode)
      publish:
        description: Publish scan results to the gallery
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'history' && !inputs.publish && format('medical-figure-gallery-review-{0}', github.run_id) || 'medical-figure-gallery-pages' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Scan journal catalogues
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy' && inputs.mode != 'history' && !(inputs.mode == 'weekly' && inputs.review_dois != ''))
        env:
          MODE: ${{ inputs.mode || 'weekly' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          JOURNALS: ${{ inputs.journals }}
          PUBLISH: ${{ inputs.mode == 'backfill' && inputs.publish }}
        run: |
          args=(--mode "$MODE" --start "$START" --end "$END" --journal "$JOURNALS" --report "$RUNNER_TEMP/scan-result.json")
          if [[ "$PUBLISH" == "true" ]]; then args+=(--publish); fi
          python3 tools/scan_gallery.py "${args[@]}"
      - name: Save weekly candidates and update the scan date
        if: github.event_name == 'schedule' || (inputs.mode == 'weekly' && inputs.publish && inputs.review_dois == '')
        run: python3 tools/update_weekly.py --scan "$RUNNER_TEMP/scan-result.json"
      - name: Publish reviewed weekly originals
        if: inputs.mode == 'weekly' && inputs.publish && inputs.review_dois != ''
        env:
          REVIEW_DOIS: ${{ inputs.review_dois }}
        run: python3 tools/update_weekly.py --reviewed "$REVIEW_DOIS"
      - name: Read historical report
        if: inputs.mode == 'history' && inputs.report_run != ''
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: ${{ runner.temp }}/gallery-history
          run-id: ${{ inputs.report_run }}
          github-token: ${{ github.token }}
      - name: Apply verified historical coverage and selected abstracts
        if: inputs.mode == 'history'
        env:
          REVIEW_DOIS: ${{ inputs.review_dois }}
          REPORT_RUN: ${{ inputs.report_run }}
        run: |
          archive="data/history-2026-11-27.json"
          report="$archive"
          if [[ -n "$REPORT_RUN" ]]; then report="$RUNNER_TEMP/gallery-history/scan-result.json"; fi
          python3 tools/promote_history.py --report "$report" --selection "$REVIEW_DOIS"
      - name: Store scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: ${{ runner.temp }}/scan-result.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Apply gallery interface updates
        if: github.event_name == 'push'
        run: |
          if [[ -f tools/update_site.py ]]; then python3 tools/update_site.py; fi
      - name: Check whether the completed 2026 supplement has been archived
        id: supplement
        if: github.event_name == 'push'
        run: |
          if [[ ! -f data/history-supplement-2026-11-27.json ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the completed 27-journal scan
        if: steps.supplement.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: journal-supplement-2026
          path: ${{ runner.temp }}/gallery-supplement
          run-id: 45958344022
          github-token: ${{ github.token }}
      - name: Merge historical coverage and publish approved original figures
        if: steps.supplement.outputs.needed == 'true'
        run: |
          cp "$RUNNER_TEMP/gallery-supplement/supplement-2026.json" data/history-supplement-2026-11-27.json
          python3 tools/promote_history.py
      - name: Add new individually reviewed images
        if: github.event_name == 'push' && steps.supplement.outputs.needed != 'true'
        run: python3 tools/promote_history.py --if-new
      - name: Validate embedded gallery data
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish || inputs.mode == 'deploy'
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          document = Path('index.html').read_text(encoding='utf-8')
          for identifier in ('journal-registry', 'catalog', 'collection-report'):
              match = re.search(rf'<script id="{identifier}"[^>]*>\s*(.*?)</script>', document, re.S)
              json.loads(match[1])
          PY
      - name: Commit updated gallery
        if: github.event_name == 'push' || github.event_name == 'schedule' || (inputs.publish && inputs.mode != 'deploy')
        run: |
          git add index.html
          if [[ -f data/history-2026-11-27.json ]]; then git add data/history-2026-11-27.json; fi
          if [[ -f data/history-supplement-2026-11-27.json ]]; then git add data/history-supplement-2026-11-27.json; fi
          if [[ -f data/weekly-review.json ]]; then git add data/weekly-review.json; fi
          if [[ -d assets/reference ]]; then git add assets/reference; fi
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update medical figure gallery"
            git push origin HEAD:main
          fi
      - name: Stage public site
        id: site
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish || inputs.mode == 'deploy'
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-site"
          cp index.html "$RUNNER_TEMP/gallery-site/"
          if [[ -d assets ]]; then cp -R assets "$RUNNER_TEMP/gallery-site/"; fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Upload Pages site
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/gallery-site
  deploy:
    if: needs.scan.outputs.deploy == 'true'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
