name: Medical figure gallery
on:
  schedule:
    - cron: "20 1 * * 1"
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [pilot, backfill, weekly, history, repair, deploy]
        default: pilot
      start:
        description: First online date, start (YYYY-MM-DD, optional)
      end:
        description: First online date, end (YYYY-MM-DD, optional)
      journals:
        description: Comma-separated journal names (optional)
      report_run:
        description: Historical scan run ID (optional, uses the saved cloud report when blank)
      review_dois:
        description: Comma-separated reviewed DOIs to include (history mode)
      publish:
        description: Publish scan results to the gallery
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'history' && !inputs.publish && format('medical-figure-gallery-review-{0}', github.run_id) || 'medical-figure-gallery-pages' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Scan journal catalogues
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy' && inputs.mode != 'history' && inputs.mode != 'repair')
        env:
          MODE: ${{ inputs.mode || 'weekly' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          JOURNALS: ${{ inputs.journals }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          args=(--mode "$MODE" --start "$START" --end "$END" --journal "$JOURNALS" --report "$RUNNER_TEMP/scan-result.json")
          if [[ "$PUBLISH" == "true" ]]; then args+=(--publish); fi
          python3 tools/scan_gallery.py "${args[@]}"
      - name: Read historical report
        if: inputs.mode == 'history' && inputs.report_run != ''
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: ${{ runner.temp }}/gallery-history
          run-id: ${{ inputs.report_run }}
          github-token: ${{ github.token }}
      - name: Apply verified historical coverage and selected abstracts
        if: inputs.mode == 'history'
        env:
          REVIEW_DOIS: ${{ inputs.review_dois }}
          REPORT_RUN: ${{ inputs.report_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          archive="data/history-2026-11-27.json"
          report="$archive"
          if [[ -n "$REPORT_RUN" ]]; then report="$RUNNER_TEMP/gallery-history/scan-result.json"; fi
          python3 tools/publish_history.py --report "$report" --selection "$REVIEW_DOIS"
          if [[ "$PUBLISH" == "true" && "$report" != "$archive" ]]; then
            mkdir -p data
            cp "$report" "$archive"
          fi
      - name: Store scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: ${{ runner.temp }}/scan-result.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Restore catalogue after web editor truncation
        if: inputs.mode == 'repair'
        run: |
          previous=6fbbdf70809248e73f4c6062563f898d70d81467
          git fetch --no-tags origin "$previous"
          python3 - "$previous" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          path = Path('index.html')
          current = path.read_text(encoding='utf-8')
          previous = subprocess.check_output(['git', 'show', f'{sys.argv[1]}:index.html'], text=True, encoding='utf-8')

          def section(document, identifier):
              pattern = rf'<script id="{identifier}"[^>]*>\s*(.*?)</script>'
              return re.search(pattern, document, re.S)

          registry = section(current, 'journal-registry')
          previous_registry = section(previous, 'journal-registry')
          names = lambda raw: sorted(j['name'] for g in json.loads(raw)['groups'] for j in g['journals'])
          assert names(registry[1]) == names(previous_registry[1])
          restored = previous[:previous_registry.start()] + registry[0] + previous[previous_registry.end():]
          for identifier in ('journal-registry', 'catalog', 'collection-report'):
              json.loads(section(restored, identifier)[1])
          assert len(json.loads(section(restored, 'catalog')[1])) == 81
          path.write_text(restored, encoding='utf-8')
          PY
      - name: Validate embedded gallery data
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish || inputs.mode == 'deploy' || inputs.mode == 'repair'
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          document = Path('index.html').read_text(encoding='utf-8')
          for identifier in ('journal-registry', 'catalog', 'collection-report'):
              match = re.search(rf'<script id="{identifier}"[^>]*>\s*(.*?)</script>', document, re.S)
              json.loads(match[1])
          PY
      - name: Commit updated gallery
        if: github.event_name == 'schedule' || (inputs.publish && inputs.mode != 'deploy') || inputs.mode == 'repair'
        run: |
          git add index.html
          if [[ -f data/history-2026-11-27.json ]]; then git add data/history-2026-11-27.json; fi
          if [[ -d assets/reference ]]; then git add assets/reference; fi
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update medical figure gallery"
            git push origin HEAD:main
          fi
      - name: Stage public site
        id: site
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish || inputs.mode == 'deploy' || inputs.mode == 'repair'
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-site"
          cp index.html "$RUNNER_TEMP/gallery-site/"
          if [[ -d assets/reference ]]; then cp -R assets "$RUNNER_TEMP/gallery-site/"; fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Upload Pages site
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/gallery-site
  deploy:
    if: needs.scan.outputs.deploy == 'true'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
